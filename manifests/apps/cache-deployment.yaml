apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: cache
  name: cache
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  strategy: {}
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
      - image: wbitt/network-multitool:3.24.4
        name: network-multitool
        ports:
        - containerPort: 80
        resources: {}
status: {}
